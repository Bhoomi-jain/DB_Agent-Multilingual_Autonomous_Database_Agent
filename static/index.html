<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DB Agent</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #141b31;
      --panel-2: #1b2540;
      --text: #edf2ff;
      --muted: #a9b4d0;
      --accent: #7c9cff;
      --accent-2: #a78bfa;
      --danger: #ff8c8c;
      --border: #2b385d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at top right, #1b2850 0, var(--bg) 45%);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(980px, 100%); margin: 0 auto; padding: 32px 18px 48px; }
    header { margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.04em; }
    .subtitle { color: var(--muted); margin: 8px 0 0; }
    .card {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 18px 50px #0004;
      margin-top: 16px;
    }
    label { display: block; color: var(--muted); font-size: .9rem; margin-bottom: 7px; }
    input, textarea {
      width: 100%;
      color: var(--text);
      background: #0d1428;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 13px;
      font: inherit;
    }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .row { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font: 600 1rem inherit;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: .55; }
    .actions { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
    .hint, .status { color: var(--muted); font-size: .9rem; }
    .error { color: var(--danger); white-space: pre-wrap; }
    .answer { white-space: pre-wrap; font-size: 1.08rem; }
    details { margin-top: 18px; }
    summary { cursor: pointer; color: var(--muted); }
    pre {
      overflow: auto;
      padding: 14px;
      border-radius: 10px;
      background: #0a1020;
      border: 1px solid var(--border);
      color: #dce5ff;
      white-space: pre-wrap;
    }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .example {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-size: .85rem;
    }
    @media (max-width: 680px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ask your database</h1>
      <p class="subtitle">Multilingual, read-only natural-language database analysis.</p>
    </header>

    <section class="card">
      <div class="row">
        <div>
          <label for="token">API token</label>
          <input id="token" type="password" autocomplete="off" placeholder="Bearer token">
        </div>
        <div>
          <label for="question">Question</label>
          <textarea id="question" placeholder="Ask a question in any language..."></textarea>
        </div>
      </div>
      <div class="examples">
        <button class="example" type="button">How many customers are there?</button>
        <button class="example" type="button">Which artist has the most tracks?</button>
        <button class="example" type="button">What is the total revenue?</button>
      </div>
      <div class="actions">
        <button id="ask" type="button">Ask database</button>
        <span id="status" class="status"></span>
      </div>
      <p class="hint">Your token is kept only in this browser tab and is sent over the API request.</p>
    </section>

    <section id="result" class="card" hidden>
      <div id="error" class="error" hidden></div>
      <div id="answer" class="answer"></div>
      <details>
        <summary>SQL used</summary>
        <pre id="sql"></pre>
      </details>
      <details>
        <summary>Run metrics</summary>
        <pre id="metrics"></pre>
      </details>
    </section>
  </main>
  <script>
    const token = document.getElementById("token");
    const question = document.getElementById("question");
    const ask = document.getElementById("ask");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const error = document.getElementById("error");
    const answer = document.getElementById("answer");
    const sql = document.getElementById("sql");
    const metrics = document.getElementById("metrics");

    token.value = sessionStorage.getItem("db-agent-token") || "";
    token.addEventListener("input", () => sessionStorage.setItem("db-agent-token", token.value));
    document.querySelectorAll(".example").forEach((button) => {
      button.addEventListener("click", () => { question.value = button.textContent; question.focus(); });
    });
    question.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") ask.click();
    });

    ask.addEventListener("click", async () => {
      const text = question.value.trim();
      if (!text) { question.focus(); return; }
      ask.disabled = true;
      status.textContent = "Thinking...";
      result.hidden = false;
      error.hidden = true;
      answer.textContent = "";
      sql.textContent = "";
      metrics.textContent = "";
      try {
        const response = await fetch("/v1/query", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token.value.trim()}`
          },
          body: JSON.stringify({ question: text })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || `Request failed (${response.status})`);
        answer.textContent = `${body.answer}\n\nLanguage: ${body.language}`;
        sql.textContent = body.sql || "No SQL returned.";
        metrics.textContent = body.metrics?.summary || JSON.stringify(body.metrics, null, 2);
        status.textContent = "Completed";
      } catch (err) {
        error.hidden = false;
        error.textContent = err.message;
        status.textContent = "Request failed";
      } finally {
        ask.disabled = false;
      }
    });
  </script>
</body>
</html>
