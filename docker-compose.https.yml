services:
  agent:
    expose:
      - "8000"
    ports: []

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      agent:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
